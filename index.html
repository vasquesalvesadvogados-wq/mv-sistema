<!-- identidade do escritório: síncrono e antes de tudo (escreve o título; o script do tema abaixo lê a chave daqui) -->
<script src="js/escritorio.js?v=1.0.9"></script>
<meta name="color-scheme" content="light dark">
<!-- modo noturno: aplica a preferência salva ANTES das folhas de estilo, senão a página pisca clara -->
<script>(function(){try{var p=localStorage.getItem(ESCRITORIO.chaves.tema)||'claro';var t=p==='auto'?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro'):(p==='escuro'?'escuro':'claro');document.documentElement.setAttribute('data-tema',t);}catch(e){}})();</script>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" data-marca="logo"></div>
      <div>
        <div class="brand-name" data-marca="curto"></div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-user" id="sidebar-user"></div>
      <div class="sidebar-version" data-marca="versao"></div>
      <button class="btn btn-ghost btn-sm" id="btn-tema" data-tema-botao style="margin-top:8px;width:100%" aria-pressed="false" onclick="UI.tema.alternar()">Modo noturno</button>
      <button class="btn btn-ghost btn-sm" id="btn-sair" hidden title="Sair do sistema" style="margin-top:8px;width:100%" onclick="Cloud.sairConfirmando()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions" id="topbar-acoes"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog"></div>
</div>
<div class="toasts" id="toasts"></div>

<!-- Tela de entrada. O cloud.js controla #auth-gate e os campos #auth-*;
     js/ui-abertura.js só cuida da seda e da troca entre as duas etapas. -->
<div id="auth-gate" hidden>
  <canvas class="abertura-seda" aria-hidden="true"></canvas>

  <div class="abertura" data-etapa="abertura">
    <div class="abertura-marca">
      <div class="abertura-monograma" data-marca="logo"></div>
      <div class="abertura-nome" data-marca="nome"></div>
      <div class="abertura-linha" data-marca="subtitulo"></div>
    </div>

    <button type="button" class="abertura-entrar">Entrar no sistema</button>

    <div class="auth-card">
      <div class="auth-sub">Acesse com seu e-mail e senha</div>
      <div id="auth-error" class="auth-error" hidden></div>
      <div class="field"><label for="auth-email">E-mail</label><input id="auth-email" type="email" autocomplete="username"></div>
      <div class="field"><label for="auth-senha">Senha</label><input id="auth-senha" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-lg" id="auth-entrar">Entrar</button>
      <a href="#" id="auth-esqueci" class="auth-link">Esqueci minha senha</a>
    </div>
  </div>
</div>
</body>
